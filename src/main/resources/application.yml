spring:

  application:
    name: transaction-service

  datasource:
    url: jdbc:h2:mem:embank
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

  jackson:
    deserialization:
      fail-on-unknown-properties: true # rejeita requisições com campos não mapeados no dto

  h2:
    console:
      enabled: true
      path: /h2-console

  output:
    ansi:
      enabled: always

server:
  port: 8080